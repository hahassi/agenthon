<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>조각연습실</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #FBFAF5;
      --ink: #151515;
      --paper: #ECE5D3;
      --mint: #A8E2C8;
      --lavender: #C9B8F0;
      --paper-light: #F4EFE2;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 500 16px/1.6 "Pretendard", "Malgun Gothic", sans-serif;
      word-break: keep-all;
    }

    main {
      width: min(1320px, calc(100% - 72px));
      margin: 24px auto 46px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: inherit;
      text-decoration: none;
      font-weight: 800;
    }

    .logo {
      display: inline-block;
      width: 34px;
      aspect-ratio: 1;
      flex: none;
      background: center / 171.4286% no-repeat url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAMAAAADACAMAAABlApw1AAAAYFBMVEX58pz275n27pn17pr17pnz7pz17Zvz7Jvy7Jnw2LHww8/vw9Dvw8/vw8613sep3NLSzsan29HHrsy5pc+5pc6xqLy3o81cWlMeHiIcGh0aGiAaGh8aGh4ZGh4YGB4TExoxKbTrAAAEcklEQVR42u3cDW/aMBAG4GRJqRWISgjBnrPE//9f7uwkkA9vZRaFc/eeVK1iDN3D+ePstSRZ5JEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA3xSQB8aPwHg4YBcYb4HxYEC+KwPjIzDefjwYcNiHRLH/qJgAyv0hIIoDmwoAAAAAAAAAAAAAAAAAAE8HVFUVL6Ckr+PxGHMFqAZFcTgGnCvZAJxhH2EFygXhGDmABFXEQyhoOX01oFwL/rUEzCrwDQB7ADAH/jNAGfkyGv9GtihBjK1E9M3ct2in7TCK/EAT+ZEStxIAAAAAAN8fUIwRKaAoypOLg5/AHVAcTnV9oahrIgQBqlcCKH9KfYiLV8C7AjR8rvlbQVncCajuKMJTAPP8rSAyQHGoV7EdRHcNoZcBTmvAqeA8B4pVrEfQMIY2z2I8ib2ATVSe2IwhTzwYkL6f66C4qE2YZjnqq4/GbJ8l0q8HnD99wAL6VbQ+QLt+FidAuwxt5HoISaNXT3oS4HzPEFoDKLn1PuB7zjMAdRigpRJU8xEkTfsqwPlTjwegezWbBTQDVK9fBKjDKuAEw+JJfzRqMwO4A2geKzmWoJK+/J8J+GQmewFUg17JhkLSKuvJn3sFSNAq9ZOCdixf/vwBNAvGUHFWgBJMhpAmVkAmXEQHUNcKuBeeADoagDE22SVAt71RUQCUkY00Rus5QClKnx5W/AEub0FbV69vgN5ua/bhuYAJgDa5BYAKkIjUEeYVoPQTkTRtxwxg/8WpngEof3qnM0q3kd0ASIWUDaWf7UQyLwEHAB2YGyll23XdrYejVOldJ0YzJJjSN4lwDyZitqcxAJxr2+gY2+qPBG0H0PByIkum/Ojt3w2PJbNzwesBNn/TtXp4T7tp7RfT78bmt1/zHb9xJWADoNm7WFWGGtAUSPOd7/UJZOd2z2gILdd1V4POLTiZ2L48DSlBBxtOQ6hR3WJrdSWgFBVN2nURdm5dsvsbG8C5lusueZjH1EnYZXMh2CV2F5un/3rA5bRpMqe1lKogRboQuI2NVy/0R4Bte6RYJpcKO/57FQGA3n7XN6xySxPXXbSKO0CPEyDffuSDbZB6w2sStxtAb5cg4d0Hhgap572Mdmq2CWw2A5Gz2om9G1l/7YVo5Z/yEyKfajBDs2wltJmaIXsmENdmbnhsl8/P96+vwGXbzA3nmTwb2p7xQJNJ213Q3iwWFywMhtCFarBsp90sprfe9Q3ddCJTrrtwvSjbA82vxZHMLZjd7Ew8LK4JvzPx5khpBY3bspa3EtpQoy3U/G6I6aHeJkajR23vhWiHNjqGiy3ajN119Ppmjlo8HcfNnL5eLab2859uV4s6vtvplCLJ4r2dFtPtdJT/wUGjfoouUoAZw//XEQD0GG2sgL8HAAAAAAAA3AB1MCAovqACQeH7scv74sGALHsPDBEY2aM/8TV9cuBDgwEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACe8RuRlmqprujrDwAAAABJRU5ErkJggg==");
    }

    header nav a {
      color: inherit;
      font-size: .86rem;
      text-underline-offset: 5px;
    }

    .hero {
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      align-items: center;
      gap: 20px;
      padding: 12px 0 28px;
    }

    .intro { grid-column: 1 / 10; }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(2.8rem, 7.9vw, 7.2rem);
      line-height: 1.05;
      letter-spacing: -.095em;
      font-weight: 900;
    }

    .intro p {
      margin: 0;
      font-size: clamp(.96rem, 1.65vw, 1.24rem);
    }

    .hero .logo {
      width: clamp(82px, 12vw, 160px);
      grid-column: 11 / 13;
      justify-self: end;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 3fr) minmax(0, 9fr);
      gap: 12px;
      scroll-margin-top: 12px;
    }

    aside {
      display: grid;
      grid-template-rows: auto auto 1fr;
      gap: 6px;
    }

    .step { padding: 16px 20px; }
    .step:nth-child(1) { background: var(--paper); }
    .step:nth-child(2) { background: var(--mint); }
    .step:nth-child(3) { background: var(--lavender); }

    .step h2 {
      margin: 0 0 2px;
      font-size: 1.1rem;
      font-weight: 850;
    }

    .step p {
      margin: 0;
      font-size: .87rem;
    }

    .chat {
      min-width: 0;
      background: var(--paper-light);
    }

    iframe {
      display: block;
      width: 100%;
      height: clamp(330px, calc(100vh - 305px), 600px);
      border: 0;
      background: #FFFFFF;
    }

    a:focus-visible {
      outline: 2px solid currentColor;
      outline-offset: 4px;
    }

    @media (max-width: 760px) {
      main {
        width: calc(100% - 28px);
        margin-top: 14px;
      }

      header { margin-bottom: 14px; }

      .hero {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 6px 0 18px;
      }

      .hero .logo { width: 68px; }

      h1 {
        margin-bottom: 8px;
        font-size: clamp(2rem, 8.8vw, 3.7rem);
      }

      .workspace {
        display: flex;
        flex-direction: column;
      }

      .chat { order: -1; }
      iframe { height: clamp(360px, calc(100dvh - 180px), 620px); }
      .step { padding: 12px 14px; }
    }
  </style>
</head>
<body>
  <main id="top">
    <header>
      <a class="brand" href="#top">
        <span class="logo" aria-hidden="true"></span>
        조각연습실
      </a>
      <nav aria-label="페이지 메뉴">
        <a href="#chat">연습 시작</a>
      </nav>
    </header>

    <section class="hero" aria-labelledby="main-title">
      <div class="intro">
        <h1 id="main-title">조각연습실</h1>
        <p>좋아하는 디자인에서 한 조각을 골라 직접 만들어 봐요.</p>
      </div>
      <span class="logo" aria-hidden="true"></span>
    </section>

    <div class="workspace" id="chat">
      <aside aria-label="연습 순서">
        <section class="step">
          <h2>레퍼런스와 태그</h2>
          <p>배우고 싶은 표현을 말하면 작품과 조각 태그를 찾아드려요.</p>
        </section>
        <section class="step">
          <h2>따라 만들기</h2>
          <p>쓰는 도구로 한 요소를 연습하고 내 작업에 적용해요.</p>
        </section>
        <section class="step">
          <h2>비교와 기록</h2>
          <p>무엇을 바꿨고 어떻게 달라졌는지 정리해요.</p>
        </section>
      </aside>

      <section class="chat" aria-label="조각연습실 코치">
        <iframe
          title="조각연습실 코치와 대화"
          src="https://copilotstudio.microsoft.com/environments/4950c877-33c2-e096-ac60-f5b5afd14db4/bots/cr765_bot_GhZVR6/webchat?__version__=2&amp;enableFileAttachment=false&amp;cliAgent=true"
        ></iframe>
      </section>
    </div>
  </main>
</body>
</html>
